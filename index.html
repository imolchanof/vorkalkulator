<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Диагностика рекламы в стройке</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: linear-gradient(135deg,#0f172a,#111d35);
    color: #e4e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 480px; width: 100%; }

  /* progress */
  .progress-bar {
    height: 4px;
    background: #1a2640;
    border-radius: 4px;
    margin-bottom: 40px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg,#3b82f6,#6366f1);
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* card */
  .card {
    background: #131e30;
    border: 1px solid #1e3050;
    border-radius: 24px;
    padding: 32px 24px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
  }

  .step-indicator {
    font-size: 12px;
    font-weight: 700;
    color: #4b5f7b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .question {
    font-size: 22px;
    font-weight: 800;
    color: #f0f4ff;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .hint {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 24px;
  }

  .input-group {
    display: flex;
    align-items: center;
    background: #0a0f1a;
    border: 1px solid #1e3050;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }
  .input-group:focus-within { border-color: #3b82f6; }
  .input-group input {
    flex: 1;
    background: none;
    border: none;
    color: #e4e8f0;
    font-size: 28px;
    font-weight: 700;
    font-family: inherit;
    outline: none;
    text-align: center;
    min-width: 0;
  }
  .input-group input::placeholder { color: #1f2640; font-weight: 500; }
  .input-group .suffix {
    font-size: 16px;
    color: #64748b;
    font-weight: 600;
    margin-left: 8px;
    white-space: nowrap;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s;
    margin-top: auto;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    color: #fff;
    box-shadow: 0 4px 20px rgba(59,130,246,0.25);
  }
  .btn-back {
    background: transparent;
    color: #64748b;
    margin-top: 8px;
    font-size: 14px;
  }

  /* result screen */
  .result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #1a2640;
  }
  .result-item:last-child { border-bottom: none; }
  .ri-label { font-size: 13px; color: #94a3b8; }
  .ri-value { font-size: 18px; font-weight: 800; color: #f0f4ff; }
  .ri-value.green { color: #4ade80; }
  .ri-value.red { color: #f87171; }
  .ri-value.yellow { color: #fbbf24; }

  .verdict {
    text-align: center;
    padding: 16px;
    border-radius: 16px;
    margin: 16px 0;
  }
  .verdict.problem {
    background: linear-gradient(135deg,#1a0f0f,#131e30);
    border: 1px solid #5c1a1a;
  }
  .verdict.problem .title { font-size: 16px; font-weight: 700; color: #f87171; }
  .verdict.problem .desc { font-size: 13px; color: #c8d0dc; margin-top: 4px; }
  .verdict.ok {
    background: linear-gradient(135deg,#0f1a0f,#131e30);
    border: 1px solid #165c1a;
  }
  .verdict.ok .title { font-size: 16px; font-weight: 700; color: #4ade80; }
  .verdict.ok .desc { font-size: 13px; color: #c8d0dc; margin-top: 4px; }

  .cta-btn {
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 16px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    color: #fff;
    margin-top: 12px;
    box-shadow: 0 4px 20px rgba(59,130,246,0.25);
  }
  .cta-btn .sub { font-size: 12px; font-weight: 500; opacity: 0.7; margin-top: 2px; }

  .footer { text-align: center; margin-top: 16px; color: #1a2640; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="card" id="card">
    <div class="step-indicator" id="stepLabel">Шаг 1 из 5</div>
    <div class="question" id="questionText"></div>
    <div class="hint" id="hintText"></div>
    <div class="input-group" id="inputGroup">
      <input type="number" id="inputField" placeholder="0" min="0" step="1000">
      <span class="suffix" id="suffixText"></span>
    </div>
    <button class="btn btn-primary" id="nextBtn">Далее</button>
    <button class="btn btn-back" id="backBtn" style="display:none;">← Назад</button>
  </div>

  <div class="footer">Диагностика рекламы в стройке</div>
</div>

<script>
  const TG_LINK = 'https://t.me/imolchanof';

  const questions = [
    { q: 'Сколько тратите на рекламу в месяц?', h: 'Бюджет на все каналы (Яндекс, Авито, VK)', s: '₽', k: 'budget' },
    { q: 'Сколько заявок получаете?', h: 'Заявок в месяц со всех каналов', s: 'шт', k: 'leads' },
    { q: 'Сколько встреч проводите?', h: 'Количество встреч с клиентами', s: 'шт', k: 'meets' },
    { q: 'Сколько продаж закрываете?', h: 'Продаж в месяц', s: 'шт', k: 'sales' },
    { q: 'Какой общий доход?', h: 'Сумма всех продаж за месяц', s: '₽', k: 'revenue' },
  ];

  const data = { budget: 0, leads: 0, meets: 0, sales: 0, revenue: 0, margin: 0 };
  let step = 0;
  let marginShown = false;

  const progressFill = document.getElementById('progressFill');
  const stepLabel = document.getElementById('stepLabel');
  const questionText = document.getElementById('questionText');
  const hintText = document.getElementById('hintText');
  const inputField = document.getElementById('inputField');
  const suffixText = document.getElementById('suffixText');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  const card = document.getElementById('card');
  const inputGroup = document.getElementById('inputGroup');

  function renderStep() {
    if (step < 5) {
      progressFill.style.width = ((step + 1) / 6) * 100 + '%';
      stepLabel.textContent = 'Шаг ' + (step + 1) + ' из 5';
      const q = questions[step];
      questionText.textContent = q.q;
      hintText.textContent = q.h;
      suffixText.textContent = q.s;
      inputField.value = data[q.k] || '';
      inputField.placeholder = '0';
      inputField.step = q.k === 'margin' ? '5' : q.k === 'revenue' ? '10000' : '1';
      inputField.focus();
      nextBtn.textContent = step === 4 ? 'Диагностировать!' : 'Далее';
      backBtn.style.display = step > 0 ? 'block' : 'none';
      inputGroup.style.display = 'flex';
      nextBtn.style.display = 'block';
    } else if (step === 5 && !marginShown) {
      // margin step
      stepLabel.textContent = 'Шаг 5 из 5';
      questionText.textContent = 'Какой у вас процент маржи?';
      hintText.textContent = 'Сколько чистыми остаётся с каждой продажи после расходов';
      suffixText.textContent = '%';
      inputField.value = data.margin || 30;
      inputField.step = '5';
      inputField.focus();
      nextBtn.textContent = 'Показать результат';
      backBtn.style.display = 'block';
      inputGroup.style.display = 'flex';
      nextBtn.style.display = 'block';
      marginShown = true;
      progressFill.style.width = '100%';
    } else {
      showResults();
    }
  }

  function nextStep() {
    if (step < 5) {
      const q = questions[step];
      const val = parseFloat(inputField.value) || 0;
      data[q.k] = val;
      step++;
      if (step === 5) {
        marginShown = false;
      }
      renderStep();
    } else if (step === 5 && !marginShown) {
      // first time on margin screen — show it
      marginShown = true;
      renderStep();
    } else if (step === 5 && marginShown) {
      // user clicked "Показать результат"
      data.margin = parseFloat(inputField.value) || 30;
      step++;
      renderStep();
    }
  }

  function prevStep() {
    if (step > 0) {
      const q = questions[step - 1];
      const val = parseFloat(inputField.value) || 0;
      if (step === 5 && !marginShown) {
        data['revenue'] = val;
      } else if (step < 5) {
        data[q.k] = val;
      } else if (step === 6) {
        data.margin = val;
      }
      step--;
      marginShown = false;
      renderStep();
    }
  }

  function fmt(n) {
    if (isNaN(n) || n === Infinity || n === -Infinity) return '—';
    if (n < 0) return '−' + Math.round(Math.abs(n)).toLocaleString('ru-RU') + ' ₽';
    return Math.round(n).toLocaleString('ru-RU') + ' ₽';
  }

  function showResults() {
    const { budget, leads, meets, sales, revenue } = data;
    const marginPct = (data.margin || 30) / 100;

    const cpl = leads > 0 ? budget / leads : 0;
    const cpm = meets > 0 ? budget / meets : 0;
    const avg = sales > 0 ? revenue / sales : 0;
    const cr1 = leads > 0 ? (meets / leads) * 100 : 0;
    const cr2 = meets > 0 ? (sales / meets) * 100 : 0;
    const overall = leads > 0 ? (sales / leads) * 100 : 0;
    const marginRevenue = revenue * marginPct;
    const profit = marginRevenue - budget;

    // find worst problem
    const NORM_CR1 = 40, NORM_CR2 = 50;
    let problemText = '', problemType = 'ok';
    let gap1 = cr1 > 0 ? cr1 / NORM_CR1 : 1;
    let gap2 = cr2 > 0 ? cr2 / NORM_CR2 : 1;

    if (gap1 < gap2 && gap1 < 0.8) {
      problemType = 'problem';
      problemText = `⚠️ Заявки не доходят до встреч (${cr1.toFixed(0)}% при норме ${NORM_CR1}%). Из ${leads} заявок встречу получают только ${meets}. Нужно: быстрый ответ, скрипты, обучение менеджеров.`;
    } else if (gap2 < 0.8) {
      problemType = 'problem';
      problemText = `⚠️ Встречи не закрываются в сделки (${cr2.toFixed(0)}% при норме ${NORM_CR2}%). Из ${meets} встреч продажей заканчиваются только ${sales}. Нужно: проработка презентации, квалификация клиентов.`;
    } else if (cpl > 3000 && leads > 0) {
      problemType = 'problem';
      problemText = `⚠️ Слишком дорогие заявки (${fmt(cpl)}). Норма для стройки — до 2000 ₽. Широкий таргетинг или не те площадки.`;
    } else if (profit < 0) {
      problemType = 'problem';
      problemText = `🔥 Бюджет не окупается. Тратите ${fmt(budget)}, чистыми получаете ${fmt(marginRevenue)}. Нужно смотреть всю воронку.`;
    } else {
      problemText = '✅ Всё в порядке. Воронка работает, реклама окупается. Можно масштабировать.';
    }

    card.innerHTML = `
      <div class="step-indicator">Диагностика завершена 🎯</div>
      
      <div class="verdict ${problemType}">
        <div class="title">${problemType === 'ok' ? '✅ Всё в порядке' : '🔥 Найдена проблема'}</div>
        <div class="desc">${problemText}</div>
      </div>

      <div style="margin:12px 0;">
        <div class="result-item"><span class="ri-label">Бюджет</span><span class="ri-value">${fmt(budget)}</span></div>
        <div class="result-item"><span class="ri-label">Заявки</span><span class="ri-value">${leads} шт</span></div>
        <div class="result-item"><span class="ri-label">Встречи</span><span class="ri-value">${meets} шт</span></div>
        <div class="result-item"><span class="ri-label">Продажи</span><span class="ri-value">${sales} шт</span></div>
      </div>

      <div style="font-size:12px;font-weight:700;color:#4b5f7b;text-transform:uppercase;letter-spacing:0.4px;margin-top:8px;">Показатели</div>
      <div style="margin:8px 0;">
        <div class="result-item">
          <span class="ri-label">Цена заявки (CPL)</span>
          <span class="ri-value ${cpl > 0 && cpl < 2000 ? 'green' : cpl > 0 && cpl < 5000 ? 'yellow' : cpl > 0 ? 'red' : ''}">${cpl > 0 ? fmt(cpl) : '—'}</span>
        </div>
        <div class="result-item">
          <span class="ri-label">Заявка → Встреча</span>
          <span class="ri-value ${cr1 >= 40 ? 'green' : cr1 >= 20 ? 'yellow' : 'red'}">${cr1 > 0 ? cr1.toFixed(0) + '%' : '—'}</span>
        </div>
        <div class="result-item">
          <span class="ri-label">Встреча → Сделка</span>
          <span class="ri-value ${cr2 >= 50 ? 'green' : cr2 >= 25 ? 'yellow' : 'red'}">${cr2 > 0 ? cr2.toFixed(0) + '%' : '—'}</span>
        </div>
        <div class="result-item">
          <span class="ri-label">Чистыми с учётом маржи</span>
          <span class="ri-value ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' + fmt(profit) : '−' + fmt(Math.abs(profit))}</span>
        </div>
      </div>

      <a class="cta-btn" href="${TG_LINK}?text=Хочу сессию с разбором моей рекламы" target="_blank">
        📩 Записаться на сессию к Илье
        <div class="sub">30 минут — разберём вашу ситуацию бесплатно</div>
      </a>

      <button class="btn btn-back" onclick="resetQuiz()" style="display:block;margin-top:12px;">← Пройти заново</button>
    `;
    progressFill.style.width = '100%';
  }

  function resetQuiz() {
    data.budget = 0; data.leads = 0; data.meets = 0; data.sales = 0; data.revenue = 0; data.margin = 0;
    step = 0; marginShown = false;
    document.querySelector('.container').innerHTML = `
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="card" id="card">
        <div class="step-indicator" id="stepLabel">Шаг 1 из 5</div>
        <div class="question" id="questionText"></div>
        <div class="hint" id="hintText"></div>
        <div class="input-group" id="inputGroup">
          <input type="number" id="inputField" placeholder="0" min="0" step="1000">
          <span class="suffix" id="suffixText"></span>
        </div>
        <button class="btn btn-primary" id="nextBtn">Далее</button>
        <button class="btn btn-back" id="backBtn" style="display:none;">← Назад</button>
      </div>
      <div class="footer">Диагностика рекламы в стройке</div>
    `;
    location.reload();
  }

  nextBtn.addEventListener('click', nextStep);
  backBtn.addEventListener('click', prevStep);
  inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') nextStep(); });
  inputField.addEventListener('input', () => {
    inputGroup.style.borderColor = '#1e3050';
    setTimeout(() => inputGroup.style.borderColor = '#1e3050', 300);
  });

  renderStep();
</script>
</body>
</html>
